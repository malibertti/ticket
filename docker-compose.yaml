services:
  postgres:
    image: postgres:18
    command:
      ['postgres', '-c', 'wal_level=logical', '-c', 'max_replication_slots=4']
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ticketing
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    ports: ['6379:6379']
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.5.0
    # profiles: [search]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ['9200:9200']
    volumes: ['osdata:/usr/share/opensearch/data']
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    profiles: [search]
    ports: ['5601:5601']
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    depends_on: [opensearch]

  dynamodb-local:
    image: amazon/dynamodb-local:3.3.1
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    user: root
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    restart: unless-stopped
    ports:
      - '3300:3000' # Grafana UI (admin / admin)
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP

  redpanda:
    image: redpandadata/redpanda:v25.3.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - '9092:9092' # Kafka API
      - '8081:8081' # Schema Registry
      - '9644:9644' # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      retries: 20
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v3.4.0
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: 'true'
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - '8080:8080'
    depends_on: [redpanda]
    restart: unless-stopped

volumes:
  pgdata:
  osdata:
  dynamodb-data:
  redpanda-data:
